<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扩散模型与视觉计算前沿 - 在线考试系统</title>
<!-- KaTeX for math rendering (loaded async) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" media="print" onload="this.media='all'">
<style>
/* ===== CSS Variables ===== */
:root {
  --primary: #1E2761;
  --primary-light: #2A3680;
  --secondary: #CADCFC;
  --accent: #4F7DF5;
  --accent-hover: #3B6AE0;
  --success: #22C55E;
  --success-bg: #DCFCE7;
  --error: #EF4444;
  --error-bg: #FEE2E2;
  --warning: #F59E0B;
  --warning-bg: #FEF3C7;
  --bg: #F0F4FA;
  --bg-white: #FFFFFF;
  --text: #1E293B;
  --text-secondary: #64748B;
  --text-light: #94A3B8;
  --border: #E2E8F0;
  --shadow: 0 1px 3px rgba(30,39,97,0.08), 0 1px 2px rgba(30,39,97,0.06);
  --shadow-md: 0 4px 6px rgba(30,39,97,0.07), 0 2px 4px rgba(30,39,97,0.06);
  --shadow-lg: 0 10px 15px rgba(30,39,97,0.1), 0 4px 6px rgba(30,39,97,0.05);
  --shadow-xl: 0 20px 25px rgba(30,39,97,0.1), 0 10px 10px rgba(30,39,97,0.04);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

/* ===== Page: Home ===== */
.page { display: none; }
.page.active { display: block; }

.home-page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 20px;
  background: linear-gradient(135deg, #1E2761 0%, #2A3680 50%, #1E2761 100%);
  position: relative;
  overflow: hidden;
}
.home-page::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 50%, rgba(79,125,245,0.15) 0%, transparent 50%),
              radial-gradient(circle at 70% 50%, rgba(202,220,252,0.1) 0%, transparent 50%);
  animation: bgFloat 20s ease-in-out infinite;
}
@keyframes bgFloat {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  33% { transform: translate(2%, -1%) rotate(1deg); }
  66% { transform: translate(-1%, 1%) rotate(-1deg); }
}

.home-header {
  text-align: center;
  color: white;
  margin-bottom: 50px;
  position: relative;
  z-index: 1;
  animation: fadeInDown 0.8s ease;
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}
.home-header h1 {
  font-size: 2.2em;
  font-weight: 700;
  margin-bottom: 12px;
  letter-spacing: 2px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}
.home-header p {
  font-size: 1.1em;
  color: var(--secondary);
  opacity: 0.9;
}

.exam-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  max-width: 1400px;
  width: 100%;
  position: relative;
  z-index: 1;
}
@media (max-width: 1200px) {
  .exam-cards { grid-template-columns: repeat(2, 1fr); max-width: 700px; }
}
@media (max-width: 600px) {
  .exam-cards { grid-template-columns: 1fr; max-width: 500px; }
}

.exam-card {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-radius: var(--radius-lg);
  padding: 36px 28px;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: var(--shadow-lg);
  border: 2px solid transparent;
  position: relative;
  overflow: hidden;
  animation: fadeInUp 0.6s ease both;
}
.exam-card:nth-child(1) { animation-delay: 0.1s; }
.exam-card:nth-child(2) { animation-delay: 0.2s; }
.exam-card:nth-child(3) { animation-delay: 0.3s; }
.exam-card:nth-child(4) { animation-delay: 0.4s; }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.exam-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-xl);
  border-color: var(--accent);
}
.exam-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent), var(--secondary));
  opacity: 0;
  transition: var(--transition);
}
.exam-card:hover::after { opacity: 1; }

.card-icon {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 1.5em;
  font-weight: 700;
  margin-bottom: 20px;
  box-shadow: 0 4px 12px rgba(79,125,245,0.3);
}
.card-title {
  font-size: 1.3em;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 8px;
}
.card-info {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 16px;
}
.card-info-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.9em;
  color: var(--text-secondary);
}
.card-info-item .label {
  font-weight: 600;
  color: var(--text);
  min-width: 60px;
}
.card-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.75em;
  font-weight: 600;
  margin-top: 16px;
}
.card-badge.has-progress {
  background: var(--warning-bg);
  color: var(--warning);
}

/* ===== Page: Exam ===== */
.exam-page { display: none; flex-direction: column; min-height: 100vh; }
.exam-page.active { display: flex; }

/* Top Bar */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 64px;
  background: var(--primary);
  color: white;
  display: flex;
  align-items: center;
  padding: 0 24px;
  z-index: 100;
  box-shadow: 0 2px 10px rgba(30,39,97,0.3);
}
.top-bar-left {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 1;
}
.btn-back {
  background: rgba(255,255,255,0.15);
  border: none;
  color: white;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.9em;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-back:hover { background: rgba(255,255,255,0.25); }
.exam-title-bar {
  font-size: 1.1em;
  font-weight: 600;
}
.top-bar-center {
  display: flex;
  align-items: center;
  gap: 20px;
}
.timer {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.1em;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  padding: 6px 14px;
  background: rgba(255,255,255,0.1);
  border-radius: var(--radius-sm);
}
.timer.warning { color: var(--warning); background: rgba(245,158,11,0.2); }
.timer.danger { color: var(--error); background: rgba(239,68,68,0.2); animation: timerPulse 1s ease-in-out infinite; }
@keyframes timerPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
.timer svg { width: 18px; height: 18px; }
.progress-info {
  font-size: 0.9em;
  opacity: 0.9;
}
.top-bar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.btn-submit-top {
  background: var(--accent);
  border: none;
  color: white;
  padding: 8px 20px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.9em;
  font-weight: 600;
  transition: var(--transition);
}
.btn-submit-top:hover { background: var(--accent-hover); transform: scale(1.02); }

/* Progress Bar */
.progress-bar-container {
  position: fixed;
  top: 64px; left: 0; right: 0;
  height: 4px;
  background: rgba(30,39,97,0.1);
  z-index: 99;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--success));
  transition: width 0.5s ease;
  border-radius: 0 2px 2px 0;
}

/* Main Layout */
.exam-body {
  display: flex;
  margin-top: 68px;
  flex: 1;
}

/* Sidebar */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--bg-white);
  border-right: 1px solid var(--border);
  height: calc(100vh - 68px);
  position: fixed;
  top: 68px;
  left: 0;
  overflow-y: auto;
  padding: 20px 16px;
  z-index: 50;
  box-shadow: 2px 0 10px rgba(0,0,0,0.03);
}
.sidebar-section-title {
  font-size: 0.8em;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 16px 0 10px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--border);
}
.sidebar-section-title:first-child { margin-top: 0; }
.question-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}
.q-nav-btn {
  width: 100%;
  aspect-ratio: 1;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-white);
  cursor: pointer;
  font-size: 0.85em;
  font-weight: 600;
  color: var(--text-secondary);
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.q-nav-btn:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.05); }
.q-nav-btn.current { border-color: var(--accent); background: var(--accent); color: white; box-shadow: 0 2px 8px rgba(79,125,245,0.3); }
.q-nav-btn.answered { border-color: var(--success); background: var(--success-bg); color: var(--success); }
.q-nav-btn.answered.current { border-color: var(--accent); background: var(--accent); color: white; }
.q-nav-btn.flagged::after {
  content: '';
  position: absolute;
  top: 2px; right: 2px;
  width: 6px; height: 6px;
  background: var(--warning);
  border-radius: 50%;
}

/* Content Area */
.content-area {
  flex: 1;
  margin-left: 260px;
  padding: 30px 40px 100px;
  max-width: 900px;
}

/* Question Card */
.question-card {
  background: var(--bg-white);
  border-radius: var(--radius-lg);
  padding: 32px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
  animation: fadeIn 0.3s ease;
  border: 1px solid var(--border);
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.question-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.q-number {
  background: var(--primary);
  color: white;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.85em;
  font-weight: 700;
}
.q-type-badge {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.8em;
  font-weight: 600;
}
.q-type-badge.single { background: #DBEAFE; color: #1D4ED8; }
.q-type-badge.multiple { background: #FEF3C7; color: #B45309; }
.q-type-badge.tf { background: #E0E7FF; color: #4338CA; }
.q-difficulty {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.8em;
  font-weight: 600;
}
.q-difficulty.easy { background: var(--success-bg); color: #15803D; }
.q-difficulty.medium { background: var(--warning-bg); color: #B45309; }
.q-difficulty.hard { background: var(--error-bg); color: #DC2626; }
.q-direction {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.8em;
  font-weight: 500;
  background: var(--bg);
  color: var(--text-secondary);
}
.question-text {
  font-size: 1.05em;
  line-height: 1.8;
  color: var(--text);
  margin-bottom: 24px;
  white-space: pre-wrap;
}
.multiple-hint {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--warning-bg);
  border-radius: var(--radius-sm);
  font-size: 0.88em;
  color: #92400E;
  margin-bottom: 20px;
  border-left: 3px solid var(--warning);
}

/* Options */
.options-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.option-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  background: var(--bg-white);
}
.option-item:hover {
  border-color: var(--accent);
  background: rgba(79,125,245,0.03);
}
.option-item.selected {
  border-color: var(--accent);
  background: rgba(79,125,245,0.06);
}
.option-item.selected .option-indicator {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.option-indicator {
  width: 28px;
  height: 28px;
  min-width: 28px;
  border: 2px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8em;
  font-weight: 700;
  color: var(--text-secondary);
  transition: var(--transition);
}
.option-item.selected .option-indicator::after {
  content: '';
  width: 10px;
  height: 10px;
  background: white;
  border-radius: 50%;
}
.multiple .option-indicator { border-radius: 6px; }
.multiple .option-item.selected .option-indicator::after {
  content: '\2713';
  background: none;
  color: white;
  font-size: 1em;
  font-weight: 700;
}
.option-text {
  flex: 1;
  font-size: 0.98em;
  line-height: 1.6;
  padding-top: 2px;
}

/* True/False Buttons */
.tf-buttons {
  display: flex;
  gap: 20px;
}
.tf-btn {
  flex: 1;
  padding: 24px;
  border: 3px solid var(--border);
  border-radius: var(--radius-lg);
  cursor: pointer;
  text-align: center;
  font-size: 1.2em;
  font-weight: 700;
  transition: var(--transition);
  background: var(--bg-white);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.tf-btn .tf-icon {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2em;
  transition: var(--transition);
}
.tf-btn.true-btn .tf-icon { background: #DCFCE7; color: var(--success); }
.tf-btn.false-btn .tf-icon { background: #FEE2E2; color: var(--error); }
.tf-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.tf-btn.true-btn.selected { border-color: var(--success); background: var(--success-bg); }
.tf-btn.false-btn.selected { border-color: var(--error); background: var(--error-bg); }

/* Navigation Buttons */
.nav-buttons {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 24px;
  gap: 16px;
}
.nav-btn {
  padding: 12px 28px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-white);
  cursor: pointer;
  font-size: 0.95em;
  font-weight: 600;
  color: var(--text);
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.nav-btn:disabled:hover { border-color: var(--border); color: var(--text); }
.btn-submit-main {
  padding: 12px 36px;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  border: none;
  border-radius: var(--radius);
  color: white;
  cursor: pointer;
  font-size: 1em;
  font-weight: 700;
  transition: var(--transition);
  box-shadow: 0 4px 12px rgba(79,125,245,0.3);
}
.btn-submit-main:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(79,125,245,0.4); }

/* ===== Modal ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(30,39,97,0.5);
  backdrop-filter: blur(4px);
  z-index: 200;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--bg-white);
  border-radius: var(--radius-lg);
  padding: 36px;
  max-width: 480px;
  width: 90%;
  box-shadow: var(--shadow-xl);
  animation: modalIn 0.3s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.9) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal h3 {
  font-size: 1.3em;
  color: var(--primary);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.modal p {
  color: var(--text-secondary);
  margin-bottom: 8px;
  line-height: 1.6;
}
.modal-actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  justify-content: flex-end;
}
.modal-btn {
  padding: 10px 24px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--border);
  background: var(--bg-white);
  cursor: pointer;
  font-size: 0.95em;
  font-weight: 600;
  transition: var(--transition);
}
.modal-btn:hover { border-color: var(--accent); }
.modal-btn.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.modal-btn.primary:hover { background: var(--accent-hover); }
.modal-btn.danger {
  background: var(--error);
  color: white;
  border-color: var(--error);
}
.modal-btn.danger:hover { background: #DC2626; }

/* ===== Result Page ===== */
.result-page { display: none; }
.result-page.active { display: block; }
.result-container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 40px 20px;
}
.result-header {
  text-align: center;
  margin-bottom: 40px;
  animation: fadeInDown 0.6s ease;
}
.result-header h1 {
  font-size: 2em;
  color: var(--primary);
  margin-bottom: 8px;
}
.result-score-card {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: var(--radius-lg);
  padding: 40px;
  color: white;
  text-align: center;
  margin-bottom: 32px;
  box-shadow: var(--shadow-xl);
  animation: fadeInUp 0.6s ease 0.1s backwards;
}
.score-number {
  font-size: 4em;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 8px;
}
.score-label {
  font-size: 1.1em;
  opacity: 0.9;
}
.score-detail {
  font-size: 1.5em;
  font-weight: 600;
  margin-top: 12px;
  opacity: 0.95;
}

/* Score breakdown */
.score-breakdown {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 32px;
  animation: fadeInUp 0.6s ease 0.2s backwards;
}
@media (max-width: 700px) {
  .score-breakdown { grid-template-columns: 1fr; }
}
.breakdown-card {
  background: var(--bg-white);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.breakdown-card .bc-title {
  font-size: 0.9em;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.breakdown-card .bc-score {
  font-size: 2em;
  font-weight: 700;
  color: var(--primary);
}
.breakdown-card .bc-detail {
  font-size: 0.85em;
  color: var(--text-light);
  margin-top: 4px;
}

/* Result actions */
.result-actions {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-bottom: 40px;
  animation: fadeInUp 0.6s ease 0.3s backwards;
}

/* Question review */
.review-section {
  animation: fadeInUp 0.6s ease 0.4s backwards;
}
.review-section h2 {
  font-size: 1.3em;
  color: var(--primary);
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border);
}
.review-card {
  background: var(--bg-white);

            "answer": false,
            "explanation": "APG论文发现平行组件主要导致过饱和，正交组件增强图像质量。因此降低平行组件权重可以有效消除过饱和问题。参考：《Eliminating Oversaturation and Artifacts》，Sadat et al., ICLR 2025"
          }
        ]
      }
    ]
  }
};


// ===== State =====
let currentExam = null;
let currentExamId = null;
let allQuestions = [];  // flat list of {sectionIdx, qIdx, type, question}
let answers = {};       // globalIdx -> value
let currentQIdx = 0;
let timerInterval = null;
let remainingSeconds = 0;
let submitted = false;

// ===== Initialize =====
function init() {
  renderExamCards();
}

// ===== Home Page =====
function renderExamCards() {
  const container = document.getElementById('examCards');
  const examIds = ['A', 'B', 'C', 'D'];
  const icons = ['A', 'B', 'C', 'D'];
  container.innerHTML = examIds.map((id, i) => {
    const exam = EXAM_DATA[id];
    const totalQ = exam.sections.reduce((s, sec) => s + sec.questions.length, 0);
    const progress = getExamProgress(id);
    let badge = '';
    if (progress > 0 && progress < totalQ) {
      badge = '<div class="card-badge has-progress">已答 ' + progress + '/' + totalQ + ' 题</div>';
    } else if (progress === totalQ) {
      badge = '<div class="card-badge has-progress">全部已答</div>';
    }
    return '<div class="exam-card" onclick="startExam(\'' + id + '\')">' +
      '<div class="card-icon">' + icons[i] + '</div>' +
      '<div class="card-title">' + exam.title + '</div>' +
      '<div class="card-info">' +
        '<div class="card-info-item"><span class="label">总分</span>' + exam.total_score + ' 分</div>' +
        '<div class="card-info-item"><span class="label">题量</span>' + totalQ + ' 题</div>' +
        '<div class="card-info-item"><span class="label">时长</span>' + exam.duration_minutes + ' 分钟</div>' +
      '</div>' +
      badge +
    '</div>';
  }).join('');
}

function getExamProgress(examId) {
  try {
    const saved = localStorage.getItem('exam_progress_' + examId);
    if (!saved) return 0;
    const data = JSON.parse(saved);
    return Object.keys(data.answers || {}).length;
  } catch(e) { return 0; }
}

// ===== Start Exam =====
function startExam(examId) {
  currentExamId = examId;
  currentExam = EXAM_DATA[examId];
  submitted = false;

  // Load saved progress
  try {
    const saved = localStorage.getItem('exam_progress_' + examId);
    if (saved) {
      const data = JSON.parse(saved);
      answers = data.answers || {};
      remainingSeconds = data.remainingSeconds || currentExam.duration_minutes * 60;
    } else {
      answers = {};
      remainingSeconds = currentExam.duration_minutes * 60;
    }
  } catch(e) {
    answers = {};
    remainingSeconds = currentExam.duration_minutes * 60;
  }

  // Build flat question list
  allQuestions = [];
  currentExam.sections.forEach((sec, sIdx) => {
    sec.questions.forEach((q, qIdx) => {
      allQuestions.push({ sectionIdx: sIdx, qIdx: qIdx, type: sec.type, question: q });
    });
  });

  currentQIdx = 0;
  showPage('examPage');
  document.getElementById('examTitleBar').textContent = currentExam.title;
  renderSidebar();
  renderQuestion();
  startTimer();
  saveProgress();
}

// ===== Page Navigation =====
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  if (pageId !== 'examPage') {
    stopTimer();
  }
}

// ===== Timer =====
function startTimer() {
  stopTimer();
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    if (submitted) { stopTimer(); return; }
    remainingSeconds--;
    if (remainingSeconds <= 0) {
      remainingSeconds = 0;
      stopTimer();
      autoSubmit();
      return;
    }
    updateTimerDisplay();
    // Save every 30 seconds
    if (remainingSeconds % 30 === 0) saveProgress();
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function updateTimerDisplay() {
  const m = Math.floor(remainingSeconds / 60);
  const s = remainingSeconds % 60;
  const display = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  document.getElementById('timerDisplay').textContent = display;
  const timerEl = document.getElementById('timer');
  timerEl.classList.remove('warning', 'danger');
  if (remainingSeconds <= 300) timerEl.classList.add('danger');
  else if (remainingSeconds <= 600) timerEl.classList.add('warning');
}

function autoSubmit() {
  showModal('时间到！', '<p>考试时间已结束，系统将自动提交您的答卷。</p>', [
    { text: '查看成绩', class: 'primary', action: () => { hideModal(); submitExam(); } }
  ]);
}

// ===== Sidebar =====
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = '';
  const typeNames = { single_choice: '单选题', multiple_choice: '多选题', true_false: '判断题' };
  let qNum = 0;
  currentExam.sections.forEach((sec, sIdx) => {
    html += '<div class="sidebar-section-title">' + sec.title + '</div>';
    html += '<div class="question-grid">';
    sec.questions.forEach((q, qIdx) => {
      const globalIdx = qNum;
      const isAnswered = answers[globalIdx] !== undefined && answers[globalIdx] !== null &&
        (Array.isArray(answers[globalIdx]) ? answers[globalIdx].length > 0 : true);
      const isCurrent = globalIdx === currentQIdx;
      let cls = 'q-nav-btn';
      if (isCurrent) cls += ' current';
      else if (isAnswered) cls += ' answered';
      html += '<button class="' + cls + '" onclick="goToQuestion(' + globalIdx + ')">' + (qIdx + 1) + '</button>';
      qNum++;
    });
    html += '</div>';
  });
  sidebar.innerHTML = html;
}

function updateSidebar() {
  renderSidebar();
}

// ===== Question Rendering =====
function renderQuestion() {
  if (currentQIdx < 0 || currentQIdx >= allQuestions.length) return;
  const qData = allQuestions[currentQIdx];
  const q = qData.question;
  const sec = currentExam.sections[qData.sectionIdx];
  const container = document.getElementById('contentArea');

  // Update progress
  const answeredCount = Object.keys(answers).filter(k => {
    const v = answers[k];
    return v !== undefined && v !== null && (Array.isArray(v) ? v.length > 0 : true);
  }).length;
  const total = allQuestions.length;
  document.getElementById('progressInfo').textContent = answeredCount + '/' + total;
  document.getElementById('progressBar').style.width = (answeredCount / total * 100) + '%';

  // Difficulty labels
  const diffLabels = { easy: '易', medium: '中', hard: '难' };
  const typeLabels = { single_choice: '单选题', multiple_choice: '多选题', true_false: '判断题' };
  const typeCls = { single_choice: 'single', multiple_choice: 'multiple', true_false: 'tf' };

  let html = '<div class="question-card">';
  html += '<div class="question-header">';
  html += '<span class="q-number">第 ' + (currentQIdx + 1) + ' 题</span>';
  html += '<span class="q-type-badge ' + typeCls[qData.type] + '">' + typeLabels[qData.type] + '</span>';
  html += '<span class="q-difficulty ' + q.difficulty + '">' + diffLabels[q.difficulty] + '</span>';
  html += '<span class="q-direction">' + q.direction + '</span>';
  html += '</div>';
  html += '<div class="question-text">' + escapeHtml(q.question) + '</div>';

  if (qData.type === 'single_choice') {
    html += '<div class="options-list">';
    q.options.forEach((opt, i) => {
      const letter = String.fromCharCode(65 + i);
      const selected = answers[currentQIdx] === letter;
      html += '<div class="option-item' + (selected ? ' selected' : '') + '" onclick="selectSingle(' + currentQIdx + ', \'' + letter + '\')">';
      html += '<div class="option-indicator">' + letter + '</div>';
      html += '<div class="option-text">' + escapeHtml(opt) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  } else if (qData.type === 'multiple_choice') {
    html += '<div class="multiple-hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>多选题：错选不得分，漏选得0.5分</div>';
    html += '<div class="options-list multiple">';
    q.options.forEach((opt, i) => {
      const letter = String.fromCharCode(65 + i);
      const currentAnswer = answers[currentQIdx] || [];
      const selected = currentAnswer.includes(letter);
      html += '<div class="option-item' + (selected ? ' selected' : '') + '" onclick="toggleMultiple(' + currentQIdx + ', \'' + letter + '\')">';
      html += '<div class="option-indicator">' + letter + '</div>';
      html += '<div class="option-text">' + escapeHtml(opt) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  } else if (qData.type === 'true_false') {
    const currentAnswer = answers[currentQIdx];
    html += '<div class="tf-buttons">';
    html += '<div class="tf-btn true-btn' + (currentAnswer === true ? ' selected' : '') + '" onclick="selectTF(' + currentQIdx + ', true)">';
    html += '<div class="tf-icon">\u2713</div>';
    html += '<span>正确</span></div>';
    html += '<div class="tf-btn false-btn' + (currentAnswer === false ? ' selected' : '') + '" onclick="selectTF(' + currentQIdx + ', false)">';
    html += '<div class="tf-icon">\u2717</div>';
    html += '<span>错误</span></div>';
    html += '</div>';
  }

  html += '</div>'; // question-card

  // Navigation
  html += '<div class="nav-buttons">';
  html += '<button class="nav-btn" onclick="prevQuestion()"' + (currentQIdx === 0 ? ' disabled' : '') + '>';
  html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> 上一题</button>';
  html += '<button class="btn-submit-main" onclick="confirmSubmit()">交卷</button>';
  html += '<button class="nav-btn" onclick="nextQuestion()"' + (currentQIdx === allQuestions.length - 1 ? ' disabled' : '') + '>';
  html += '下一题 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>';
  html += '</div>';

  container.innerHTML = html;
  updateSidebar();
  // Scroll to top of exam page content area (not window)
  document.getElementById('examPage').scrollTop = 0;
  // Render math formulas with KaTeX
  renderMathFormulas(container);
}

// ===== Math Rendering =====
function renderMathFormulas(element) {
  if (typeof window.renderMathInElement === 'function') {
    window.renderMathInElement(element, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false}
      ],
      throwOnError: false
    });
  }
}

// ===== Answer Handlers =====
function selectSingle(globalIdx, letter) {
  if (submitted) return;
  answers[globalIdx] = letter;
  renderQuestion();
  saveProgress();
}

function toggleMultiple(globalIdx, letter) {
  if (submitted) return;
  if (!answers[globalIdx]) answers[globalIdx] = [];
  const idx = answers[globalIdx].indexOf(letter);
  if (idx >= 0) answers[globalIdx].splice(idx, 1);
  else answers[globalIdx].push(letter);
  answers[globalIdx].sort();
  renderQuestion();
  saveProgress();
}

function selectTF(globalIdx, value) {
  if (submitted) return;
  answers[globalIdx] = value;
  renderQuestion();
  saveProgress();
}

// ===== Navigation =====
function goToQuestion(idx) {
  currentQIdx = idx;
  renderQuestion();
}
function prevQuestion() {
  if (currentQIdx > 0) { currentQIdx--; renderQuestion(); }
}
function nextQuestion() {
  if (currentQIdx < allQuestions.length - 1) { currentQIdx++; renderQuestion(); }
}

// ===== Save Progress =====
function saveProgress() {
  if (!currentExamId) return;
  try {
    localStorage.setItem('exam_progress_' + currentExamId, JSON.stringify({
      answers: answers,
      remainingSeconds: remainingSeconds
    }));
  } catch(e) {}
}

// ===== Submit =====
function confirmBack() {
  showModal('确认返回', '<p>返回首页将保留当前答题进度。</p><p>确定要返回吗？</p>', [
    { text: '取消', action: hideModal },
    { text: '确认返回', class: 'primary', action: () => { hideModal(); stopTimer(); saveProgress(); showPage('homePage'); renderExamCards(); } }
  ]);
}

function confirmSubmit() {
  const total = allQuestions.length;
  const answered = Object.keys(answers).filter(k => {
    const v = answers[k];
    return v !== undefined && v !== null && (Array.isArray(v) ? v.length > 0 : true);
  }).length;
  const unanswered = total - answered;
  let msg = '<p>您已作答 <strong>' + answered + '</strong> / ' + total + ' 题。</p>';
  if (unanswered > 0) {
    msg += '<p style="color:var(--warning);font-weight:600">还有 ' + unanswered + ' 题未作答！</p>';
  }
  msg += '<p>提交后将无法修改答案，确定要交卷吗？</p>';
  showModal('确认交卷', msg, [
    { text: '继续答题', action: hideModal },
    { text: '确认交卷', class: 'danger', action: () => { hideModal(); submitExam(); } }
  ]);
}

function submitExam() {
  submitted = true;
  stopTimer();
  // Clear saved progress
  try { localStorage.removeItem('exam_progress_' + currentExamId); } catch(e) {}

  // Calculate scores
  const result = calculateScores();
  showResultPage(result);
}

function calculateScores() {
  let singleCorrect = 0, singleTotal = 0, singleScore = 0;
  let multiCorrect = 0, multiPartial = 0, multiTotal = 0, multiScore = 0;
  let tfCorrect = 0, tfTotal = 0, tfScore = 0;
  let details = [];

  allQuestions.forEach((qData, globalIdx) => {
    const q = qData.question;
    const sec = currentExam.sections[qData.sectionIdx];
    const userAnswer = answers[globalIdx];
    let earned = 0;
    let status = 'wrong'; // correct, wrong, partial

    if (qData.type === 'single_choice') {
      singleTotal++;
      const correctAnswer = q.answer;
      if (userAnswer === correctAnswer) {
        earned = sec.score_per_question;
        singleCorrect++;
        singleScore += earned;
        status = 'correct';
      }
    } else if (qData.type === 'multiple_choice') {
      multiTotal++;
      const correctAnswer = q.answer.sort();
      const userArr = (userAnswer || []).sort();
      if (JSON.stringify(userArr) === JSON.stringify(correctAnswer)) {
        earned = sec.score_per_question;
        multiCorrect++;
        multiScore += earned;
        status = 'correct';
      } else {
        // Check partial: no wrong answers selected
        const hasWrong = userArr.some(a => !correctAnswer.includes(a));
        const hasSome = userArr.some(a => correctAnswer.includes(a));
        if (!hasWrong && hasSome && userArr.length > 0) {
          earned = 0.5;
          multiPartial++;
          multiScore += earned;
          status = 'partial';
        }
      }
    } else if (qData.type === 'true_false') {
      tfTotal++;
      if (userAnswer === q.answer) {
        earned = sec.score_per_question;
        tfCorrect++;
        tfScore += earned;
        status = 'correct';
      }
    }

    details.push({
      globalIdx: globalIdx,
      qData: qData,
      userAnswer: userAnswer,
      correctAnswer: q.answer,
      earned: earned,
      maxScore: sec.score_per_question,
      status: status
    });
  });

  const totalScore = singleScore + multiScore + tfScore;
  return {
    totalScore: totalScore,
    maxScore: currentExam.total_score,
    single: { correct: singleCorrect, total: singleTotal, score: singleScore, maxScore: singleTotal * 1 },
    multi: { correct: multiCorrect, partial: multiPartial, total: multiTotal, score: multiScore, maxScore: multiTotal * 1.5 },
    tf: { correct: tfCorrect, total: tfTotal, score: tfScore, maxScore: tfTotal * 0.5 },
    details: details
  };
}

// ===== Result Page =====
function showResultPage(result) {
  showPage('resultPage');
  const container = document.getElementById('resultContainer');

  const statusLabels = { correct: '正确', wrong: '错误', partial: '部分正确' };
  const typeLabels = { single_choice: '单选', multiple_choice: '多选', true_false: '判断' };

  let html = '';

  // Header
  html += '<div class="result-header"><h1>考试成绩报告</h1>';
  html += '<p style="color:var(--text-secondary)">' + currentExam.title + '</p></div>';

  // Score card
  html += '<div class="result-score-card">';
  html += '<div class="score-label">总分</div>';
  html += '<div class="score-number">' + result.totalScore.toFixed(1) + '</div>';
  html += '<div class="score-detail">满分 ' + result.maxScore + ' 分 | 得分率 ' + (result.totalScore / result.maxScore * 100).toFixed(1) + '%</div>';
  html += '</div>';

  // Breakdown
  html += '<div class="score-breakdown">';
  html += '<div class="breakdown-card"><div class="bc-title">单选题</div><div class="bc-score">' + result.single.score + '</div><div class="bc-detail">' + result.single.correct + '/' + result.single.total + ' 正确 (满分' + result.single.maxScore + ')</div></div>';
  html += '<div class="breakdown-card"><div class="bc-title">多选题</div><div class="bc-score">' + result.multi.score + '</div><div class="bc-detail">' + result.multi.correct + '全对 ' + result.multi.partial + '半对 / ' + result.multi.total + ' (满分' + result.multi.maxScore + ')</div></div>';
  html += '<div class="breakdown-card"><div class="bc-title">判断题</div><div class="bc-score">' + result.tf.score + '</div><div class="bc-detail">' + result.tf.correct + '/' + result.tf.total + ' 正确 (满分' + result.tf.maxScore + ')</div></div>';
  html += '</div>';

  // Actions
  html += '<div class="result-actions">';
  html += '<button class="nav-btn" onclick="goHome()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg> 返回首页</button>';
  html += '<button class="btn-submit-main" onclick="retakeExam()">重新答题</button>';
  html += '</div>';

  // Review
  html += '<div class="review-section"><h2>题目回顾</h2>';
  result.details.forEach((d, i) => {
    const q = d.qData.question;
    let yourAnswerStr = '未作答';
    let correctAnswerStr = '';

    if (d.qData.type === 'single_choice') {
      if (d.userAnswer) yourAnswerStr = d.userAnswer;
      correctAnswerStr = d.correctAnswer;
    } else if (d.qData.type === 'multiple_choice') {
      yourAnswerStr = (d.userAnswer && d.userAnswer.length > 0) ? d.userAnswer.join(', ') : '未作答';
      correctAnswerStr = d.correctAnswer.join(', ');
    } else if (d.qData.type === 'true_false') {
      if (d.userAnswer === true) yourAnswerStr = '正确';
      else if (d.userAnswer === false) yourAnswerStr = '错误';
      else yourAnswerStr = '未作答';
      correctAnswerStr = d.correctAnswer ? '正确' : '错误';
    }

    html += '<div class="review-card ' + d.status + '" onclick="toggleReview(this)">';
    html += '<div class="review-q-header">';
    html += '<span class="q-number" style="font-size:0.8em">第' + (i + 1) + '题</span>';
    html += '<span class="q-type-badge ' + (d.qData.type === 'single_choice' ? 'single' : d.qData.type === 'multiple_choice' ? 'multiple' : 'tf') + '">' + typeLabels[d.qData.type] + '</span>';
    html += '<span class="review-status ' + d.status + '">' + statusLabels[d.status] + '</span>';
    html += '<span class="review-score">得分: <span>' + d.earned.toFixed(1) + '</span> / ' + d.maxScore + '</span>';
    html += '</div>';
    html += '<div class="review-question">' + escapeHtml(q.question) + '</div>';
    html += '<div class="review-answers">';
    html += '<div class="review-your-answer">你的答案: <span>' + yourAnswerStr + '</span></div>';
    if (d.status !== 'correct') {
      html += '<div class="review-correct-answer">正确答案: <span>' + correctAnswerStr + '</span></div>';
    }
    html += '</div>';

    // Expandable detail
    html += '<div class="review-detail">';
    html += '<div class="explanation"><strong>解析：</strong>' + escapeHtml(q.explanation) + '</div>';
    // Show options with correct/wrong marking
    if (q.options) {
      html += '<div class="review-options-list">';
      q.options.forEach((opt, oi) => {
        const letter = String.fromCharCode(65 + oi);
        let optCls = 'is-normal';
        if (d.qData.type === 'single_choice') {
          if (letter === d.correctAnswer) optCls = 'is-correct';
          else if (letter === d.userAnswer && d.status === 'wrong') optCls = 'is-wrong';
        } else if (d.qData.type === 'multiple_choice') {
          if (d.correctAnswer.includes(letter)) optCls = 'is-correct';
          else if (d.userAnswer && d.userAnswer.includes(letter)) optCls = 'is-wrong';
        }
        let marker = letter + '.';
        if (optCls === 'is-correct') marker = letter + '. \u2713';
        else if (optCls === 'is-wrong') marker = letter + '. \u2717';
        html += '<div class="review-option ' + optCls + '"><span class="opt-marker">' + marker + '</span>' + escapeHtml(opt) + '</div>';
      });
      html += '</div>';
    }
    html += '</div>'; // review-detail
    html += '</div>'; // review-card
  });
  html += '</div>';

  container.innerHTML = html;
  // Render math formulas in result page
  renderMathFormulas(container);
}

function toggleReview(el) {
  el.classList.toggle('expanded');
}

function goHome() {
  showPage('homePage');
  renderExamCards();
}

function retakeExam() {
  answers = {};
  remainingSeconds = currentExam.duration_minutes * 60;
  currentQIdx = 0;
  submitted = false;
  try { localStorage.removeItem('exam_progress_' + currentExamId); } catch(e) {}
  startExam(currentExamId);
}

// ===== Modal =====
function showModal(title, body, buttons) {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  let html = '<h3>' + title + '</h3>' + body;
  html += '<div class="modal-actions">';
  buttons.forEach((btn, idx) => {
    html += '<button class="modal-btn ' + (btn.class || '') + '" data-modal-btn="' + idx + '">' + btn.text + '</button>';
  });
  html += '</div>';
  content.innerHTML = html;
  // Bind click handlers via JS (not inline onclick)
  content.querySelectorAll('[data-modal-btn]').forEach(el => {
    const idx = parseInt(el.getAttribute('data-modal-btn'));
    el.addEventListener('click', buttons[idx].action);
  });
  overlay.classList.add('active');
}

function hideModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

// ===== Utility =====
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ===== Keyboard Navigation =====
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('examPage').classList.contains('active')) return;
  if (submitted) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevQuestion(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextQuestion(); }
  else if (e.key >= '1' && e.key <= '5') {
    // Quick select for single/multiple choice
    const qData = allQuestions[currentQIdx];
    if (!qData) return;
    const letter = String.fromCharCode(64 + parseInt(e.key));
    if (qData.type === 'single_choice') selectSingle(currentQIdx, letter);
    else if (qData.type === 'multiple_choice') toggleMultiple(currentQIdx, letter);
  }
});

// ===== Start =====
init();
</script>
